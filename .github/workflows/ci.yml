# Every push and pull request: the backend's lint, types, unit and API
# tests; both web apps' lint and build; the server scripts; and the browser
# tests of the storefront and the admin panel against a real API and MySQL.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ecommerce_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DATABASE: ecommerce_test
      JWT_SECRET_KEY: ci-only-jwt-secret-0123456789abcdef0123456789
      OTP_HASH_SECRET: ci-only-otp-secret-0123456789abcdef0123456789
      CORS_ORIGIN: '*'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: npx jest --ci
      - name: API tests (e2e)
        run: npx jest --config ./test/jest-e2e.json --runInBand --ci

  web:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [front, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  scripts:
    name: Server scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        # A pinned release, not the runner's own: each Ubuntu image ships a
        # different ShellCheck, and they name the same warning differently -
        # the first CI run failed on exactly that. Same version as
        # `npx shellcheck` gives locally.
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ
          ./shellcheck-v0.11.0/shellcheck -x -P deploy/scripts deploy/scripts/*.sh deploy/scripts/lib/*.sh
      - name: Executable bits
        # A script stored without +x fails on the server with "Permission
        # denied" - deploy.sh itself was once committed that way.
        run: |
          for f in deploy/scripts/*.sh; do
            [ "$(git ls-files -s "$f" | cut -c1-6)" = 100755 ] || { echo "$f is not executable in git"; exit 1; }
          done

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            front/package-lock.json
            admin/package-lock.json
            e2e/package-lock.json
      - name: Install
        run: |
          for app in backend front admin e2e; do
            (cd "$app" && npm ci --no-audit --no-fund)
          done
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run
        working-directory: e2e
        run: npx playwright test
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
