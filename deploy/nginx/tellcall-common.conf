# Included by both tellcall server blocks.

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

include /etc/nginx/snippets/tellcall-headers.conf;

# The API. The trailing slash on proxy_pass strips the /api prefix, so
# /api/products reaches the backend as /products - the same rewrite Vite
# does in development.
location /api/ {
    proxy_pass http://tellcall_api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The backend runs with TRUST_PROXY=1 and takes the client address from
    # here. nginx *appends* the real peer, so a client cannot talk its way
    # past the rate limits by sending its own X-Forwarded-For.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
    client_max_body_size 55m;
    # The API sets its own security headers (helmet). Declaring any
    # add_header here stops the shared set from being inherited on top of
    # them - otherwise every header would arrive twice, with conflicting
    # values. Only the panel's noindex is added.
    add_header X-Robots-Tag $tellcall_robots always;
}

# Product images. Uploaded file names are random and never reused, so they
# can be cached hard.
location /uploads/ {
    proxy_pass http://tellcall_api/uploads/;
    proxy_set_header Host $host;
    # The backend's static server sends "Cache-Control: max-age=0" of its
    # own; drop it so the long-lived one below is the only one the browser
    # sees. (`expires` is avoided for the same reason - it adds a second.)
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=2592000, immutable";
    # Images are served by the backend too, so helmet has already set the
    # security headers on them - not repeated here.
}

# Vite's build output carries a content hash in every file name.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/tellcall-headers.conf;
    try_files $uri =404;
}

# Single-page app: any other path is a client-side route. Without this a
# refresh on /account/orders would be a 404.
location / {
    try_files $uri $uri/ /index.html;
    # index.html must never be cached, or a deploy would keep serving the
    # previous build's asset names.
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/tellcall-headers.conf;
}
