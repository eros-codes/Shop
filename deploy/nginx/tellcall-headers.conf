# Security headers, included explicitly in every location below.
#
# nginx has a trap here: a location that sets any add_header of its own
# inherits *none* of the add_header lines from the server level. Since most
# locations set Cache-Control, headers declared once at the top silently
# vanished from almost every response - including the panel's noindex.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# Only takes effect over HTTPS; browsers ignore it on plain HTTP. Scoped to
# this host - no includeSubDomains - so it never touches aboutarvin.ir.
add_header Strict-Transport-Security "max-age=31536000" always;
# Empty for the store, "noindex, nofollow" for the panel (see the map in
# tellcall.conf). nginx sends no header at all for an empty value.
add_header X-Robots-Tag $tellcall_robots always;
