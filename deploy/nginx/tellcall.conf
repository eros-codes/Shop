# tellcall - storefront and admin panel, each proxying its own /api.
#
# Both apps talk to the API as same-origin "/api", exactly as they do in
# development through Vite. That keeps the refresh cookie first-party, and
# because the store and the panel are different hosts, their cookies stay
# apart: signing in to the panel never replaces a customer session.
#
# This file is written for HTTP first. `certbot --nginx` (see DEPLOY.md)
# adds the HTTPS listeners and the redirect in place. HTTPS is not optional:
# in production the refresh cookie is Secure, and a browser will not store
# it over plain HTTP - everyone would be signed out after 15 minutes.

# The panel must stay out of search results; the store should not.
map $host $tellcall_robots {
    admin.shop.aboutarvin.ir "noindex, nofollow";
    default                  "";
}

# Link previews. Messengers read a shared link's <meta> tags without running
# JavaScript, so every product link in a chat showed the shop's generic
# title and no picture. Their crawlers - and only theirs - are sent to a
# small page the API renders (GET /share/product/:slug); people get the app.
# Search engines are left out on purpose: they run the app themselves.
map $http_user_agent $tellcall_link_preview {
    default 0;
    "~*(TelegramBot|WhatsApp|facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|Discordbot|SkypeUriPreview|Pinterestbot|redditbot|vkShare|Embedly|Iframely)" 1;
}

upstream tellcall_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    # IPv6 is left off on purpose: on a server whose kernel has IPv6 disabled
    # (some VPS images ship that way) `listen [::]:80` stops nginx from
    # starting at all. Add it back once `ip -6 addr` shows an address.
    server_name shop.aboutarvin.ir;

    root /srv/tellcall/front/dist;
    index index.html;

    # Product pages: the app for people, a rendered preview for a link
    # crawler (see the map above).
    location /product/ {
        if ($tellcall_link_preview) {
            rewrite ^ /__link-preview last;
        }
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/tellcall-headers.conf;
    }

    # A location of its own, so the page headers above (no-cache, the
    # security set) are not added on top of the API's own - proxied from
    # inside the `if`, every one of them arrived twice. $request_uri is
    # still the original "/product/<slug>", percent-encoding and all; an
    # upstream name in proxy_pass needs no resolver even with a variable.
    location = /__link-preview {
        internal;
        proxy_pass http://tellcall_api/share$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Any add_header here stops the server-level set from being inherited
        # on top of the API's (helmet) headers - the same trick as /api/.
        # Empty on the store host, so nothing is actually sent.
        add_header X-Robots-Tag $tellcall_robots always;
    }

    include /etc/nginx/snippets/tellcall-common.conf;
}

server {
    listen 80;
    server_name admin.shop.aboutarvin.ir;

    root /srv/tellcall/admin/dist;
    index index.html;

    # The panel uploads up to 10 product images of 5 MB each in one request.
    # nginx's default limit is 1 MB, which would reject every real photo
    # with a 413 before the API ever saw it.
    client_max_body_size 55m;

    include /etc/nginx/snippets/tellcall-common.conf;
}
