# tellcall - storefront and admin panel, each proxying its own /api.
#
# Both apps talk to the API as same-origin "/api", exactly as they do in
# development through Vite. That keeps the refresh cookie first-party, and
# because the store and the panel are different hosts, their cookies stay
# apart: signing in to the panel never replaces a customer session.
#
# This file is written for HTTP first. `certbot --nginx` (see DEPLOY.md)
# adds the HTTPS listeners and the redirect in place. HTTPS is not optional:
# in production the refresh cookie is Secure, and a browser will not store
# it over plain HTTP - everyone would be signed out after 15 minutes.

# The panel must stay out of search results; the store should not.
map $host $tellcall_robots {
    admin.shop.aboutarvin.ir "noindex, nofollow";
    default                  "";
}

upstream tellcall_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    # IPv6 is left off on purpose: on a server whose kernel has IPv6 disabled
    # (some VPS images ship that way) `listen [::]:80` stops nginx from
    # starting at all. Add it back once `ip -6 addr` shows an address.
    server_name shop.aboutarvin.ir;

    root /srv/tellcall/front/dist;
    index index.html;

    include /etc/nginx/snippets/tellcall-common.conf;
}

server {
    listen 80;
    server_name admin.shop.aboutarvin.ir;

    root /srv/tellcall/admin/dist;
    index index.html;

    # The panel uploads up to 10 product images of 5 MB each in one request.
    # nginx's default limit is 1 MB, which would reject every real photo
    # with a 413 before the API ever saw it.
    client_max_body_size 55m;

    include /etc/nginx/snippets/tellcall-common.conf;
}
